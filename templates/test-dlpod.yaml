AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DLPoD tethering and ALB test. Deploys a DLP On Demand appliance behind
  an internet-facing ALB with a self-signed certificate, plus Lambda automation
  for CLI-driven tethering via Step Functions. ALB access is restricted to
  AllowedIngressCidr via security group.

Parameters:
  VpcCidr:
    Type: String
    Description: CIDR block for the new VPC.
    Default: '10.0.0.0/16'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR block.

  PublicSubnet1Cidr:
    Type: String
    Description: CIDR for the first public subnet (AZ 1) — used by the internet-facing ALB.
    Default: '10.0.0.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR block.

  PublicSubnet2Cidr:
    Type: String
    Description: CIDR for the second public subnet (AZ 2) — used by the internet-facing ALB.
    Default: '10.0.1.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR block.

  PrivateSubnet1Cidr:
    Type: String
    Description: CIDR for the first private subnet (AZ 1) — used by the DLPoD instance and Lambda.
    Default: '10.0.10.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR block.

  PrivateSubnet2Cidr:
    Type: String
    Description: CIDR for the second private subnet (AZ 2) — used by Lambda.
    Default: '10.0.11.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR block.

  AllowedIngressCidr:
    Type: String
    Description: >
      Source CIDR permitted to reach the ALB on port 443. Restrict to your
      office or VPN egress IP(s) to limit exposure.
    Default: '0.0.0.0/0'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR block.

  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing Lambda packages and layers

  DlpodLambdaCodeKey:
    Type: String
    Default: lambda-dlpod.zip
    Description: S3 key for the DLPoD Lambda package

  LayerKey:
    Type: String
    Default: layers/pexpect-layer.zip
    Description: S3 key for the paramiko/pyte Lambda Layer

  DlpodAmiId:
    Type: AWS::EC2::Image::Id
    Description: DLP On Demand appliance AMI ID

  DlpodInstanceType:
    Type: String
    Default: c5a.4xlarge
    AllowedValues:
      - c5a.4xlarge
      - c5a.8xlarge
      - c5a.16xlarge
      - c5ad.4xlarge
      - c5ad.8xlarge
      - c5ad.16xlarge
    Description: >
      DLPoD instance type. c5a is available in most regions;
      c5ad adds local NVMe but has limited AZ availability.

  DlpodLicenseKey:
    Type: String
    NoEcho: true
    Description: >
      DLPoD license key from Netskope tenant
      (Settings > Security Cloud Platform > On-Premises Infrastructure)

  DnsServer:
    Type: String
    Default: ''
    Description: >
      DNS server IP for the DLPoD appliance. For AWS VPCs, use VPC CIDR
      base + 2 (e.g. 10.0.0.2 for 10.0.0.0/16). Leave empty to skip.

  DlpDomainName:
    Type: String
    Default: dlp.aigw.internal
    Description: >
      FQDN for the DLPoD ALB. A Route 53 private hosted zone is created
      for the parent domain. The self-signed cert CN matches this name.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network Configuration
        Parameters:
          - VpcCidr
          - PublicSubnet1Cidr
          - PublicSubnet2Cidr
          - PrivateSubnet1Cidr
          - PrivateSubnet2Cidr
          - AllowedIngressCidr
          - DnsServer
      - Label:
          default: DLPoD Appliance
        Parameters:
          - DlpodAmiId
          - DlpodInstanceType
          - DlpodLicenseKey
          - DlpDomainName
      - Label:
          default: Lambda Configuration
        Parameters:
          - LambdaCodeBucket
          - DlpodLambdaCodeKey
          - LayerKey

Resources:
  # =========================================================
  # DLPoD Credentials (license key + password)
  # =========================================================

  DlpodCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-dlpod-creds'
      Description: DLPoD license key and appliance password
      SecretString: !Sub >
        {
          "license_key": "${DlpodLicenseKey}",
          "default_password": "nsappliance",
          "password": ""
        }

  # =========================================================
  # VPC
  # =========================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  # =========================================================
  # Internet Gateway + Public Subnets for Internet-Facing ALB
  # =========================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # =========================================================
  # NAT Gateway + Private Subnets for DLPoD and Lambda
  # =========================================================

  NatGatewayEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-eip'

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-2'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-rt'

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # =========================================================
  # DLPoD Certificate Parameter (SSM)
  # =========================================================

  DlpodCertParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${AWS::StackName}/dlpod-cert'
      Type: String
      Value: pending
      Description: ALB certificate PEM (populated by cert generator custom resource)

  # =========================================================
  # Networking — Security Groups
  # =========================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda for DLPoD CLI automation
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: All outbound
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-lambda-sg'

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internet-facing ALB for DLPoD service - HTTPS restricted by AllowedIngressCidr
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
          Description: HTTPS from allowed source CIDR
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
          Description: HTTPS to DLPoD target
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-alb-sg'

  DlpodSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DLPoD appliance
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: SSH from Lambda (CLI automation)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: HTTPS from ALB
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: HTTPS from Lambda (cert extraction)
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: All outbound (tethering to Netskope management plane)
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dlpod-sg'

  # =========================================================
  # Route 53 Private Hosted Zone
  # =========================================================

  PrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: aigw.internal
      VPCs:
        - VPCId: !Ref Vpc
          VPCRegion: !Ref 'AWS::Region'
      HostedZoneConfig:
        Comment: !Sub 'Private zone for ${AWS::StackName} DLPoD ALB'

  DlpodDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateHostedZone
      Name: !Ref DlpDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt DlpodAlb.DNSName
        HostedZoneId: !GetAtt DlpodAlb.CanonicalHostedZoneID

  # =========================================================
  # Self-Signed Certificate — Generation + ACM Import
  # =========================================================

  CertGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-certgen-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CertGenPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - acm:ImportCertificate
                  - acm:DeleteCertificate
                  - acm:AddTagsToCertificate
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  CertGeneratorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-certgen'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      Role: !GetAtt CertGeneratorRole.Arn
      Code:
        ZipFile: |
          import json, subprocess, tempfile, os, logging, urllib.request, boto3
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          acm = boto3.client('acm')
          ssm = boto3.client('ssm')
          def send_cfn(event, context, status, data={}, pid=None):
              body = json.dumps({'Status': status, 'Reason': f'See CloudWatch {context.log_group_name}/{context.log_stream_name}', 'PhysicalResourceId': pid or event.get('PhysicalResourceId','none'), 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data}).encode()
              urllib.request.urlopen(urllib.request.Request(event['ResponseURL'], data=body, headers={'Content-Type':'','Content-Length':str(len(body))}, method='PUT'))
          def handler(event, context):
              domain = event['ResourceProperties']['DomainName']
              cert_param = event['ResourceProperties']['CertParameterName']
              stack = event['ResourceProperties']['StackName']
              rt = event['RequestType']
              try:
                  if rt in ('Create', 'Update'):
                      with tempfile.TemporaryDirectory() as d:
                          kf, cf, sc = f'{d}/k.pem', f'{d}/c.pem', f'{d}/s.cnf'
                          subprocess.run(['openssl','genrsa','-out',kf,'2048'], check=True, capture_output=True)
                          with open(sc,'w') as f:
                              f.write(f"[req]\ndistinguished_name=dn\nx509_extensions=v3\nprompt=no\n[dn]\nCN={domain}\nO=Netskope\nOU=AI Gateway\n[v3]\nsubjectAltName=DNS:{domain}\nbasicConstraints=critical,CA:TRUE\nkeyUsage=digitalSignature,keyEncipherment,keyCertSign\nextendedKeyUsage=serverAuth\n")
                          subprocess.run(['openssl','req','-new','-x509','-key',kf,'-out',cf,'-days','365','-config',sc], check=True, capture_output=True)
                          cert_pem = open(cf).read()
                          key_pem = open(kf).read()
                      r = acm.import_certificate(Certificate=cert_pem.encode(), PrivateKey=key_pem.encode(), Tags=[{'Key':'StackName','Value':stack}])
                      arn = r['CertificateArn']
                      ssm.put_parameter(Name=cert_param, Value=cert_pem, Type='String', Overwrite=True)
                      send_cfn(event, context, 'SUCCESS', {'CertificateArn': arn}, arn)
                  elif rt == 'Delete':
                      arn = event.get('PhysicalResourceId','')
                      if arn.startswith('arn:'):
                          try: acm.delete_certificate(CertificateArn=arn)
                          except: pass
                      send_cfn(event, context, 'SUCCESS', {}, arn)
              except Exception:
                  logger.exception('Failed')
                  send_cfn(event, context, 'FAILED', {}, 'FAILED')

  AlbCertificate:
    Type: Custom::AlbCertificate
    Properties:
      ServiceToken: !GetAtt CertGeneratorFunction.Arn
      DomainName: !Ref DlpDomainName
      CertParameterName: !Sub '/${AWS::StackName}/dlpod-cert'
      StackName: !Ref 'AWS::StackName'
      CertVersion: '2'

  # =========================================================
  # Private ALB for DLPoD Service
  # =========================================================

  DlpodAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-dlpod'
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dlpod-alb'

  DlpodTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-dlpod-tg'
      Protocol: HTTPS
      Port: 443
      VpcId: !Ref Vpc
      TargetType: instance
      Targets:
        - Id: !Ref DlpodInstance
          Port: 443
      HealthCheckProtocol: HTTPS
      HealthCheckPort: '443'
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: 200-499
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dlpod-tg'

  DlpodHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref DlpodAlb
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !GetAtt AlbCertificate.CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DlpodTargetGroup

  # =========================================================
  # DLPoD Instance
  # =========================================================

  DlpodInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref DlpodAmiId
      InstanceType: !Ref DlpodInstanceType
      SubnetId: !Ref PrivateSubnet1
      SecurityGroupIds:
        - !Ref DlpodSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 351
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dlpod'

  # =========================================================
  # Lambda Layer + Function
  # =========================================================

  ParamikoLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub '${AWS::StackName}-paramiko'
      Description: paramiko + pyte for CLI/TUI automation
      CompatibleRuntimes:
        - python3.12
      Content:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LayerKey

  DlpodLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-dlpod-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DlpodPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecretsAccess
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                Resource: !Ref DlpodCredentialsSecret
              - Sid: SSMAccess
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/*'
              - Sid: VPCNetworking
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: '*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  DlpodLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-dlpod'
      Description: DLPoD CLI automation handler (tethering, cert generation)
      Runtime: python3.12
      Handler: dlpod_handlers.handler
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt DlpodLambdaRole.Arn
      Layers:
        - !Ref ParamikoLayer
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
      Environment:
        Variables:
          DLPOD_SECRET_ARN: !Ref DlpodCredentialsSecret
          DLPOD_CERT_PARAM: !Sub '/${AWS::StackName}/dlpod-cert'
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref DlpodLambdaCodeKey

  # =========================================================
  # Step Functions State Machine — DLPoD Tethering
  # =========================================================

  StepFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-sfn-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt DlpodLambdaFunction.Arn

  DlpodTetheringStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${AWS::StackName}-tethering'
      RoleArn: !GetAtt StepFunctionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "DLPoD appliance tethering and certificate setup",
          "StartAt": "WaitForDlpodSSH",
          "States": {
            "WaitForDlpodSSH": {
              "Type": "Task",
              "Resource": "${DlpodLambdaFunction.Arn}",
              "Parameters": {
                "action": "dlpod_check_ssh",
                "dlpod_ip.$": "$.dlpod_ip",
                "password.$": "$.password"
              },
              "ResultPath": "$.ssh_check",
              "Next": "IsDlpodSSHReady",
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "WaitBeforeSSHRetry",
                "ResultPath": "$.error"
              }]
            },
            "IsDlpodSSHReady": {
              "Type": "Choice",
              "Choices": [{
                "Variable": "$.ssh_check.ssh_ready",
                "BooleanEquals": true,
                "Next": "ChangePassword"
              }],
              "Default": "WaitBeforeSSHRetry"
            },
            "WaitBeforeSSHRetry": {
              "Type": "Wait",
              "Seconds": 15,
              "Next": "WaitForDlpodSSH"
            },
            "ChangePassword": {
              "Type": "Task",
              "Resource": "${DlpodLambdaFunction.Arn}",
              "Parameters": {
                "action": "dlpod_change_password",
                "dlpod_ip.$": "$.dlpod_ip",
                "password.$": "$.password"
              },
              "ResultPath": "$.password_result",
              "Next": "SetDNS",
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "TetheringFailed",
                "ResultPath": "$.error"
              }]
            },
            "SetDNS": {
              "Type": "Task",
              "Resource": "${DlpodLambdaFunction.Arn}",
              "Parameters": {
                "action": "dlpod_set_dns",
                "dlpod_ip.$": "$.dlpod_ip",
                "dns_primary.$": "$.dns_primary",
                "password.$": "$.password_result.password"
              },
              "ResultPath": "$.dns_result",
              "Next": "SetLicenseKey",
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "TetheringFailed",
                "ResultPath": "$.error"
              }]
            },
            "SetLicenseKey": {
              "Type": "Task",
              "Resource": "${DlpodLambdaFunction.Arn}",
              "Parameters": {
                "action": "dlpod_set_license",
                "dlpod_ip.$": "$.dlpod_ip",
                "password.$": "$.password_result.password"
              },
              "ResultPath": "$.license_result",
              "Next": "WaitForTetheringInit",
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "TetheringFailed",
                "ResultPath": "$.error"
              }]
            },
            "WaitForTetheringInit": {
              "Type": "Wait",
              "Seconds": 120,
              "Next": "CheckTethering"
            },
            "CheckTethering": {
              "Type": "Task",
              "Resource": "${DlpodLambdaFunction.Arn}",
              "Parameters": {
                "action": "dlpod_check_tethering",
                "dlpod_ip.$": "$.dlpod_ip",
                "password.$": "$.password_result.password"
              },
              "ResultPath": "$.tethering",
              "Next": "IsTetheringComplete",
              "Catch": [{
                "ErrorEquals": ["States.ALL"],
                "Next": "WaitBeforeTetheringRetry",
                "ResultPath": "$.error"
              }]
            },
            "IsTetheringComplete": {
              "Type": "Choice",
              "Choices": [{
                "Variable": "$.tethering.tethered",
                "BooleanEquals": true,
                "Next": "TetheringComplete"
              }],
              "Default": "WaitBeforeTetheringRetry"
            },
            "WaitBeforeTetheringRetry": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "CheckTethering"
            },
            "TetheringComplete": {
              "Type": "Succeed"
            },
            "TetheringFailed": {
              "Type": "Fail",
              "Error": "TetheringFailed",
              "Cause": "DLPoD tethering did not complete successfully"
            }
          }
        }

Outputs:
  DlpodInstanceId:
    Value: !Ref DlpodInstance
  DlpodPrivateIp:
    Value: !GetAtt DlpodInstance.PrivateIp
  DlpodAlbDnsName:
    Value: !GetAtt DlpodAlb.DNSName
  DlpHostUrl:
    Description: DLP host URL for AI Gateway configuration
    Value: !Sub 'https://${DlpDomainName}'
  AlbCertificateArn:
    Value: !GetAtt AlbCertificate.CertificateArn
  CertParameterName:
    Value: !Sub '/${AWS::StackName}/dlpod-cert'
  LambdaFunctionName:
    Value: !Ref DlpodLambdaFunction
  StateMachineArn:
    Value: !Ref DlpodTetheringStateMachine
  PrivateHostedZoneId:
    Value: !Ref PrivateHostedZone

  StateMachineInput:
    Description: Full tethering state machine execution input (use nsappliance password for fresh instances)
    Value: !Sub |
      {
        "dlpod_ip": "${DlpodInstance.PrivateIp}",
        "dlpod_hostname": "${DlpDomainName}",
        "dns_primary": "${DnsServer}",
        "password": "nsappliance"
      }
