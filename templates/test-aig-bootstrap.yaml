AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AIG Secrets Manager bootstrap enrollment test. A CloudFormation Custom Resource registers one
  appliance with Netskope and writes the enrollment token to a Secrets Manager secret before the
  ASG launches any instances. The AIG appliance reads the secret at first boot and self-enrolls
  without SSH, paramiko, SNS, or Step Functions.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Netskope Tenant
        Parameters:
          - NetskopeTenantUrl
          - NetskopeApiToken
      - Label:
          default: Gateway Instance
        Parameters:
          - GatewayAmiId
          - InstanceType
      - Label:
          default: Network
        Parameters:
          - VpcCidr
          - PublicSubnetCidr
          - PublicSubnet2Cidr
          - PrivateSubnetCidr
          - PrivateSubnet2Cidr
      - Label:
          default: Tagging
        Parameters:
          - Project
          - Environment
    ParameterLabels:
      NetskopeTenantUrl:
        default: Netskope Tenant URL
      NetskopeApiToken:
        default: Netskope API Token
      GatewayAmiId:
        default: Gateway AMI ID
      InstanceType:
        default: Instance Type

Parameters:
  NetskopeTenantUrl:
    Type: String
    Description: Netskope tenant URL (e.g., https://tenant.goskope.com)
    AllowedPattern: 'https://.+'
    ConstraintDescription: Must be a valid HTTPS URL.

  NetskopeApiToken:
    Type: String
    NoEcho: true
    Description: Netskope API token for appliance registration.

  GatewayAmiId:
    Type: AWS::EC2::Image::Id
    Description: AIG appliance AMI ID (requires AIG 1.7 or later for native bootstrap support).

  InstanceType:
    Type: String
    Default: m5.4xlarge
    AllowedValues:
      - m5.4xlarge
      - m6i.4xlarge
      - c5.4xlarge
    Description: EC2 instance type for the gateway (minimum 16 vCPU, 64 GiB RAM).

  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR block.
    Description: CIDR block for the new VPC.

  PublicSubnetCidr:
    Type: String
    Default: '10.0.0.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR for the first public subnet (hosts the NAT gateway).

  PublicSubnet2Cidr:
    Type: String
    Default: '10.0.1.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR for the second public subnet (AZ 2).

  PrivateSubnetCidr:
    Type: String
    Default: '10.0.10.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR for the first private subnet (gateway instance, AZ 1).

  PrivateSubnet2Cidr:
    Type: String
    Default: '10.0.11.0/24'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: CIDR for the second private subnet (gateway instance, AZ 2).

  Project:
    Type: String
    Description: Project name, used as a tag value.
    AllowedPattern: '^[a-z0-9-]+$'
    ConstraintDescription: Lowercase alphanumeric and hyphens only.

  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment, used as a tag value.

Resources:

  # ============================================================
  # VPC and Networking
  # ============================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-1'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-2'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-1'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-2'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-eip'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-rt'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ============================================================
  # VPC Endpoints
  # The gateway instance reads the bootstrap secret from a private subnet.
  # SecretsManagerEndpoint with PrivateDnsEnabled is critical — the AIG
  # appliance uses the standard secretsmanager hostname at boot.
  # ============================================================

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTPS from within the VPC to interface endpoints.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !GetAtt Vpc.CidrBlock
          Description: HTTPS from VPC to interface endpoints
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-endpoints-sg'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref PrivateRouteTable

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  # ============================================================
  # Security Groups
  # No SSH ingress — the appliance self-enrolls at boot via Secrets Manager.
  # ============================================================

  GatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AIG gateway appliance - bootstrap enrollment, no SSH.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: All outbound traffic for appliance services and Netskope cloud connectivity.
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-gateway-sg'
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================
  # Secrets Manager
  # ============================================================

  NetskopeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-netskope-credentials'
      Description: Netskope tenant URL and API token for AIG appliance registration.
      SecretString: !Sub '{"tenant_url": "${NetskopeTenantUrl}", "api_token": "${NetskopeApiToken}"}'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  AIGBootstrapSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-aig-bootstrap'
      Description: >
        Bootstrap configuration read by the AIG appliance at first boot. The Registration
        custom resource writes the enrollment token here before the ASG launches any instances.
        The appliance reads this secret via UserData and self-enrolls without SSH.
      SecretString: '{"bootstrap": true, "enrollment_token": ""}'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================
  # IAM - Gateway instance role
  # Only needs to read the bootstrap secret. Netskope API credentials
  # stay in NetskopeSecret and are never visible to instance IAM.
  # ============================================================

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-gateway-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ReadBootstrapSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadBootstrapSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AIGBootstrapSecret
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  GatewayInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-gateway-profile'
      Roles:
        - !Ref GatewayRole

  # ============================================================
  # IAM - Registration Lambda role (Custom Resource)
  # Reads Netskope credentials, writes enrollment token to bootstrap secret.
  # ============================================================

  RegistrationFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-registration-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RegistrationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadNetskopeSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref NetskopeSecret
              - Sid: WriteBootstrapSecret
                Effect: Allow
                Action: secretsmanager:PutSecretValue
                Resource: !Ref AIGBootstrapSecret
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt RegistrationFunctionLogGroup.Arn
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================
  # Registration Lambda (inline — no S3 package required)
  # Custom Resource: Create registers appliance + writes token.
  #                  Delete deregisters appliance (best-effort).
  # ============================================================

  RegistrationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-registration'
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  RegistrationFunction:
    Type: AWS::Lambda::Function
    DependsOn: RegistrationFunctionLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-registration'
      Description: Custom Resource - registers AIG appliance with Netskope and writes bootstrap token.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt RegistrationFunctionRole.Arn
      Code:
        ZipFile: |
          import json, urllib.request, boto3
          sm = boto3.client('secretsmanager')

          def cfn_send(event, context, status, data=None, physical_id=None):
              body = json.dumps({
                  'Status': status,
                  'Reason': f'See CloudWatch: {context.log_group_name}',
                  'PhysicalResourceId': physical_id or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data or {},
              }).encode()
              req = urllib.request.Request(event['ResponseURL'], body,
                                           headers={'Content-Type': ''}, method='PUT')
              urllib.request.urlopen(req, timeout=30)

          def api_call(url, path, token, method='GET', body=None):
              req = urllib.request.Request(
                  f"{url.rstrip('/')}{path}",
                  json.dumps(body).encode() if body else None,
                  method=method)
              req.add_header('Netskope-Api-Token', token)
              req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          def handler(event, context):
              props = event.get('ResourceProperties', {})
              try:
                  creds = json.loads(sm.get_secret_value(SecretId=props['SecretArn'])['SecretString'])
                  url, token = creds['tenant_url'], creds['api_token']
                  if event['RequestType'] == 'Create':
                      resp = api_call(url, '/api/v2/aig/appliances', token, 'POST', {
                          'name': props['ApplianceName'],
                          'host': '0.0.0.0',
                          'ports': {'https': {'port': 443, 'enable': True},
                                    'http':  {'port': 80,  'enable': False}},
                      })
                      aid = str(resp['id'])
                      tok = resp.get('enrollment_token') or api_call(
                          url, f'/api/v2/aig/appliances/{aid}/enrollmenttokens',
                          token, 'POST').get('token', '')
                      if not tok:
                          raise ValueError(f'No enrollment token returned for appliance {aid}')
                      sm.put_secret_value(
                          SecretId=props['BootstrapSecretArn'],
                          SecretString=json.dumps({'bootstrap': True, 'enrollment_token': tok}))
                      cfn_send(event, context, 'SUCCESS', {'ApplianceId': aid}, aid)
                  elif event['RequestType'] == 'Delete':
                      aid = event.get('PhysicalResourceId', '')
                      if aid and not aid.startswith('arn:'):
                          try:
                              api_call(url, f'/api/v2/aig/appliances/{aid}', token, 'DELETE')
                          except Exception:
                              pass
                      cfn_send(event, context, 'SUCCESS', {}, aid)
                  else:
                      cfn_send(event, context, 'SUCCESS', {}, event.get('PhysicalResourceId', ''))
              except Exception as exc:
                  cfn_send(event, context, 'FAILED', {'Error': str(exc)},
                           event.get('PhysicalResourceId', 'error'))
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  ApplianceRegistration:
    Type: Custom::ApplianceRegistration
    Properties:
      ServiceToken: !GetAtt RegistrationFunction.Arn
      SecretArn: !Ref NetskopeSecret
      BootstrapSecretArn: !Ref AIGBootstrapSecret
      ApplianceName: !Sub '${AWS::StackName}-gateway'

  # ============================================================
  # Launch Template + Auto Scaling Group
  # DependsOn ApplianceRegistration ensures the bootstrap secret has a
  # valid enrollment token before any instance reads it at boot.
  # MaxSize: 1 — each registration produces one single-use token.
  # ============================================================

  GatewayLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-lt'
      LaunchTemplateData:
        ImageId: !Ref GatewayAmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds:
          - !Ref GatewaySecurityGroup
        IamInstanceProfile:
          Name: !Ref GatewayInstanceProfile
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              Encrypted: true
              VolumeSize: 400
              VolumeType: gp3
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        UserData:
          Fn::Base64: !Sub '{"bootstrap_secret": "${AWS::StackName}-aig-bootstrap"}'
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-gateway'
              - Key: Project
                Value: !Ref Project
              - Key: Environment
                Value: !Ref Environment
              - Key: ManagedBy
                Value: CloudFormation

  GatewayAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: ApplianceRegistration
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-asg'
      LaunchTemplate:
        LaunchTemplateId: !Ref GatewayLaunchTemplate
        Version: !GetAtt GatewayLaunchTemplate.LatestVersionNumber
      MinSize: 1
      MaxSize: 1
      DesiredCapacity: 1
      VPCZoneIdentifier:
        - !Ref PrivateSubnet
        - !Ref PrivateSubnet2
      HealthCheckType: EC2
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Project
          Value: !Ref Project
          PropagateAtLaunch: false
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: false
        - Key: ManagedBy
          Value: CloudFormation
          PropagateAtLaunch: false

Outputs:
  AutoScalingGroupName:
    Description: ASG name - check instance lifecycle state
    Value: !Ref GatewayAutoScalingGroup

  BootstrapSecretName:
    Description: Secrets Manager secret name - verify enrollment_token was written by the Custom Resource
    Value: !Sub '${AWS::StackName}-aig-bootstrap'

  RegistrationLogGroup:
    Description: CloudWatch Logs group for the registration Custom Resource Lambda
    Value: !Sub '/aws/lambda/${AWS::StackName}-registration'

  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'
