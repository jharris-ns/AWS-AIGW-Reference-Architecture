AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Combined AIG + DLPoD gateway — single stack deploying both Netskope AI Gateway appliances and
  DLP on Demand (DLPoD) appliances in a shared VPC. DLPoD is configured automatically via
  nsbootstrap.service at first boot using EC2 UserData. AIG is enrolled via native Secrets Manager
  bootstrap; its bootstrap secret includes the DLPoD CA certificate and host so DLP forwarding is
  active from first boot. Optionally deploys an AI Guardrails GPU tier behind an internal ALB
  (set GuardrailsImageS3Bucket). Creates its own VPC — no pre-existing networking required.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Required Parameters
        Parameters: [NetskopeTenantUrl, NetskopeApiToken, DlpodLicenseKey]
      - Label:
          default: Instance Count
        Parameters: [DesiredCapacity, DlpodDesiredCapacity]
      - Label:
          default: AI Gateway Appliance
        Parameters: [GatewayAmiId, InstanceType, AcmCertificateArn, ScaleOutCpuThreshold]
      - Label:
          default: DLPoD Appliance
        Parameters: [DlpodAmiId, DlpodInstanceType]
      - Label:
          default: AI Guardrails (optional — leave Image URI empty to skip)
        Parameters: [GuardrailsImageS3Bucket, GuardrailsImageS3Key, GuardrailsAmiId, GuardrailsInstanceType, GuardrailsDesiredCapacity,
                     GuardrailsContainerPort, GuardrailsHealthCheckPath]
      - Label:
          default: VPC
        Parameters: [VpcCidr]
    ParameterLabels:
      NetskopeTenantUrl:
        default: Tenant URL
      NetskopeApiToken:
        default: API Token (RBAC v3)
      GatewayAmiId:
        default: AIG AMI ID
      InstanceType:
        default: AIG Instance Type
      AcmCertificateArn:
        default: ACM Certificate ARN (optional — auto-generated if empty)
      DesiredCapacity:
        default: AIG Desired Instances
      ScaleOutCpuThreshold:
        default: AIG Scale-out CPU %
      DlpodAmiId:
        default: DLPoD AMI ID
      DlpodInstanceType:
        default: DLPoD Instance Type
      DlpodLicenseKey:
        default: DLPoD License Key
      DlpodDesiredCapacity:
        default: DLPoD Desired Instances
      GuardrailsImageS3Bucket:
        default: Guardrails Image S3 Bucket (leave empty to skip Guardrails)
      GuardrailsImageS3Key:
        default: Guardrails Image S3 Key
      GuardrailsAmiId:
        default: Guardrails GPU AMI ID (Deep Learning Base GPU AMI)
      GuardrailsInstanceType:
        default: Guardrails Instance Type
      GuardrailsDesiredCapacity:
        default: Guardrails Desired Instances
      GuardrailsContainerPort:
        default: Guardrails Container Port
      GuardrailsHealthCheckPath:
        default: Guardrails Health Check Path
      VpcCidr:
        default: VPC CIDR

  cfn-lint:
    config:
      ignore_checks:
        - W2506   # GuardrailsAmiId is String so it can default to '' (optional tier)

Parameters:

  # ── Netskope tenant ──

  NetskopeTenantUrl:
    Type: String
    Description: Netskope tenant URL, e.g. https://tenant.goskope.com

  NetskopeApiToken:
    Type: String
    NoEcho: true
    Description: RBAC v3 API token with AIG Administrator role.

  DlpodLicenseKey:
    Type: String
    NoEcho: true
    Description: >
      DLPoD license key (Netskope console: Settings > Security Cloud Platform >
      On-Premises Infrastructure).

  # ── Instance count ──

  DesiredCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Desired number of AIG instances (1–4). Min is fixed at 1, max at 4.

  DlpodDesiredCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Desired number of DLPoD instances (1–4). Min is fixed at 1, max at 4.

  # ── AIG appliance ──

  GatewayAmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0a66805d7fb085df4
    Description: >
      AIG Gateway AMI v1.7 or later. Default is v1.7.54 in us-west-1.
      Override for other regions. Contact Netskope support for region-specific AMI IDs.

  InstanceType:
    Type: String
    Default: m5.4xlarge
    AllowedValues: [m5.4xlarge, m6i.4xlarge, c5.4xlarge]
    Description: AIG instance type.

  AcmCertificateArn:
    Type: String
    Default: ''
    Description: >
      ACM certificate ARN for the internet-facing AIG ALB HTTPS listener.
      Leave empty to auto-generate a self-signed certificate (suitable for internal
      use and API clients; clients must trust the cert or disable TLS verification).
      For production with public DNS, provide a valid ACM certificate ARN.

  ScaleOutCpuThreshold:
    Type: Number
    Default: 70
    MinValue: 1
    MaxValue: 100
    Description: Average CPU % that triggers AIG scale-out (+1 instance).

  # ── DLPoD appliance ──

  DlpodAmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-0973780ab75c2fb28
    Description: >
      DLPoD appliance AMI. Default is DLP On Demand in us-west-1.
      Override for other regions. Obtain AMI IDs from Netskope support.

  DlpodInstanceType:
    Type: String
    Default: c5a.4xlarge
    AllowedValues: [c5a.4xlarge, c5a.8xlarge, c5a.16xlarge, c5ad.4xlarge, c5ad.8xlarge, c5ad.16xlarge]
    Description: DLPoD instance type.

  # ── AI Guardrails (optional) ──

  GuardrailsImageS3Bucket:
    Type: String
    Default: ''
    Description: >
      S3 bucket holding the Netskope AI Guardrails LLM Docker image tarball
      (aisecurity-llm.tgz, supplied by Netskope; upload with `aws s3 cp`). Must be in the
      same region as the stack. Leave empty to skip the Guardrails tier entirely.

  GuardrailsImageS3Key:
    Type: String
    Default: aisecurity-llm.tgz
    Description: S3 object key of the Guardrails image tarball (a `docker save` archive).

  GuardrailsAmiId:
    Type: String
    Default: ''
    Description: >
      GPU AMI with NVIDIA driver, Docker and NVIDIA Container Toolkit preinstalled
      (AWS Deep Learning Base GPU AMI, Ubuntu 22.04). Required when GuardrailsImageS3Bucket is set.

  GuardrailsInstanceType:
    Type: String
    Default: g4dn.xlarge
    AllowedValues: [g4dn.xlarge, g4dn.2xlarge, g5.xlarge, g5.2xlarge]
    Description: GPU instance type for Guardrails. Requires "Running On-Demand G and VT instances" quota.

  GuardrailsDesiredCapacity:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Desired number of Guardrails instances (1–4).

  GuardrailsContainerPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535
    Description: Port exposed by the Guardrails container and used by the internal ALB listener.

  GuardrailsHealthCheckPath:
    Type: String
    Default: /ping
    Description: ALB health check path for the Guardrails container (expects HTTP 200).

  # ── VPC ──

  VpcCidr:
    Type: String
    Default: '10.0.0.0/16'
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR block.
    Description: CIDR block for the new VPC.

Rules:

  # An AMI is mandatory when the Guardrails tier is enabled — fail before any resource is created.
  GuardrailsAmiRequired:
    RuleCondition: !Not [!Equals [!Ref GuardrailsImageS3Bucket, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref GuardrailsAmiId, '']]
        AssertDescription: GuardrailsAmiId is required when GuardrailsImageS3Bucket is set.

Conditions:

  # When true, the stack generates a self-signed certificate for the AIG ALB.
  # When false, the user-supplied AcmCertificateArn is used.
  UseAutoGeneratedAigCert: !Equals [!Ref AcmCertificateArn, '']

  # When true, the optional AI Guardrails tier (GPU ASG behind an internal ALB) is deployed
  # and the AIG bootstrap secret includes the ai_guardrails host.
  DeployGuardrails: !Not [!Equals [!Ref GuardrailsImageS3Bucket, '']]

Resources:

  # ============================================================
  # VPC and networking
  # ============================================================

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-2'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-eip'

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-rt'

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref PrivateRouteTable

  # ============================================================
  # DLPoD ALB certificate — Custom Resource Lambda
  # Generates two-tier cert hierarchy, imports leaf cert to ACM,
  # writes CA cert PEM to SSM for AIG activation Lambda.
  # Also writes CA + leaf cert + key to DlpodCertKeySecret for
  # DlpodBootstrapBuilderFunction to assemble bootstrap.json UserData.
  # ============================================================

  DlpodCertParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${AWS::StackName}/dlpod-cert'
      Type: String
      Value: pending
      Description: DLPoD CA certificate PEM — overwritten by CertGeneratorFunction at stack create.

  CertGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-certgen'
      RetentionInDays: 30
  CertGeneratorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-certgen-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CertGenPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CertGeneratorLogGroup.Arn
              - Sid: ImportCert
                Effect: Allow
                Action: [acm:ImportCertificate, acm:DeleteCertificate, acm:AddTagsToCertificate]
                Resource: '*'
              - Sid: WriteCertParam
                Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/*'
              - Sid: WriteCertKeySecret
                Effect: Allow
                Action: secretsmanager:PutSecretValue
                Resource: !Ref DlpodCertKeySecret
  CertGeneratorFunction:
    Type: AWS::Lambda::Function
    DependsOn: CertGeneratorLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-certgen'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt CertGeneratorRole.Arn
      Code:
        ZipFile: |
          import json, subprocess, tempfile, logging, urllib.request, boto3
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          acm = boto3.client('acm')
          ssm = boto3.client('ssm')
          sm  = boto3.client('secretsmanager')
          def send_cfn(event, context, status, data={}, pid=None):
              body = json.dumps({'Status': status, 'Reason': f'See {context.log_group_name}/{context.log_stream_name}', 'PhysicalResourceId': pid or event.get('PhysicalResourceId', 'none'), 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data}).encode()
              urllib.request.urlopen(urllib.request.Request(event['ResponseURL'], data=body, headers={'Content-Type': '', 'Content-Length': str(len(body))}, method='PUT'))
          def handler(event, context):
              props = event['ResourceProperties']
              domain = props['DomainName']
              cert_param = props['CertParameterName']
              stack = props['StackName']
              cert_key_secret_arn = props.get('CertKeySecretArn', '')
              rt = event['RequestType']
              try:
                  if rt in ('Create', 'Update'):
                      with tempfile.TemporaryDirectory() as d:
                          ca_key, ca_cert = f'{d}/ca.key', f'{d}/ca.crt'
                          leaf_key, leaf_csr, leaf_cert = f'{d}/leaf.key', f'{d}/leaf.csr', f'{d}/leaf.crt'
                          ca_cnf, leaf_cnf = f'{d}/ca.cnf', f'{d}/leaf.cnf'
                          open(ca_cnf, 'w').write(f"[req]\ndistinguished_name=dn\nx509_extensions=v3_ca\nprompt=no\n[dn]\nCN={domain} CA\nO=Netskope\nOU=AI Gateway\n[v3_ca]\nbasicConstraints=critical,CA:TRUE\nkeyUsage=keyCertSign,cRLSign\nsubjectKeyIdentifier=hash\n")
                          open(leaf_cnf, 'w').write(f"[req]\ndistinguished_name=dn\nprompt=no\n[dn]\nCN={domain}\nO=Netskope\nOU=AI Gateway\n[v3_leaf]\nsubjectAltName=DNS:{domain}\nbasicConstraints=critical,CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\n")
                          subprocess.run(['openssl', 'genrsa', '-out', ca_key, '2048'], check=True, capture_output=True)
                          subprocess.run(['openssl', 'req', '-new', '-x509', '-key', ca_key, '-out', ca_cert, '-days', '365', '-config', ca_cnf], check=True, capture_output=True)
                          subprocess.run(['openssl', 'genpkey', '-algorithm', 'RSA', '-pkeyopt', 'rsa_keygen_bits:2048', '-out', leaf_key], check=True, capture_output=True)
                          subprocess.run(['openssl', 'req', '-new', '-key', leaf_key, '-out', leaf_csr, '-config', leaf_cnf], check=True, capture_output=True)
                          subprocess.run(['openssl', 'x509', '-req', '-in', leaf_csr, '-CA', ca_cert, '-CAkey', ca_key, '-CAcreateserial', '-out', leaf_cert, '-days', '365', '-extfile', leaf_cnf, '-extensions', 'v3_leaf'], check=True, capture_output=True)
                          ca_pem = open(ca_cert).read()
                          leaf_pem = open(leaf_cert).read()
                          leaf_key_pem = open(leaf_key).read()
                      r = acm.import_certificate(Certificate=leaf_pem.encode(), PrivateKey=leaf_key_pem.encode(), Tags=[{'Key': 'StackName', 'Value': stack}])
                      arn = r['CertificateArn']
                      ssm.put_parameter(Name=cert_param, Value=ca_pem, Type='String', Overwrite=True)
                      logger.info('Imported leaf cert %s to ACM, wrote CA cert to SSM %s', arn, cert_param)
                      if cert_key_secret_arn:
                          sm.put_secret_value(SecretId=cert_key_secret_arn, SecretString=json.dumps({'ca_cert_pem': ca_pem, 'leaf_cert_pem': leaf_pem, 'leaf_key_pem': leaf_key_pem}))
                          logger.info('Wrote CA+leaf cert+key to %s', cert_key_secret_arn)
                      send_cfn(event, context, 'SUCCESS', {'CertificateArn': arn}, arn)
                  elif rt == 'Delete':
                      arn = event.get('PhysicalResourceId', '')
                      if arn.startswith('arn:'):
                          try:
                              acm.delete_certificate(CertificateArn=arn)
                              logger.info('Deleted cert %s', arn)
                          except Exception:
                              logger.warning('Could not delete cert %s', arn, exc_info=True)
                      send_cfn(event, context, 'SUCCESS', {}, arn)
                  else:
                      send_cfn(event, context, 'SUCCESS', {}, event.get('PhysicalResourceId', 'none'))
              except Exception:
                  logger.exception('CertGeneratorFunction failed')
                  send_cfn(event, context, 'FAILED', {}, 'FAILED')

  # Custom Resource invocation — runs CertGeneratorFunction at stack create/delete.
  # CREATE_COMPLETE means /${StackName}/dlpod-cert is populated in SSM (CA cert PEM)
  # and DlpodCertKeySecret has ca_cert_pem + leaf_cert_pem + leaf_key_pem.
  # ACM cert ARN is available via !GetAtt DlpodAlbCertificate.CertificateArn.
  DlpodAlbCertificate:
    Type: Custom::AlbCertificate
    Properties:
      ServiceToken: !GetAtt CertGeneratorFunction.Arn
      DomainName: dlp.aigw.internal
      # !Ref (not !Sub) so CloudFormation creates the SSM placeholder before the Lambda
      # overwrites it; otherwise the placeholder create can fail with ParameterAlreadyExists.
      CertParameterName: !Ref DlpodCertParameter
      StackName: !Ref 'AWS::StackName'
      CertKeySecretArn: !Ref DlpodCertKeySecret

  # AIG ALB certificate — only created when AcmCertificateArn is left empty.
  # Uses the same CertGeneratorFunction to generate a separate cert for the AIG ALB.
  AigCertParameter:
    Condition: UseAutoGeneratedAigCert
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${AWS::StackName}/aig-cert'
      Type: String
      Value: pending
      Description: AIG ALB certificate PEM — overwritten by CertGeneratorFunction at stack create.

  AigAlbCertificate:
    Condition: UseAutoGeneratedAigCert
    Type: Custom::AlbCertificate
    Properties:
      ServiceToken: !GetAtt CertGeneratorFunction.Arn
      DomainName: aig.aigw.internal
      CertParameterName: !Ref AigCertParameter   # !Ref for ordering — see DlpodAlbCertificate
      StackName: !Ref 'AWS::StackName'

  # ============================================================
  # Security Groups
  # ============================================================

  # AIG: internet-facing ALB
  AigAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AIG ALB - HTTPS inbound from internet, egress to AIG instances.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '0.0.0.0/0'
          Description: HTTPS from internet
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS to AIG instances
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-aig-alb-sg'

  # AIG: gateway instances
  AigGatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AIG instances - HTTPS from AIG ALB, egress unrestricted.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref AigAlbSecurityGroup
          Description: HTTPS from AIG ALB
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: All outbound (Netskope cloud + DLPoD ALB + NAT)
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-aig-gw-sg'

  # DLPoD: internal ALB
  DlpodAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DLPoD ALB - HTTPS from AIG instances, egress to DLPoD instances.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS to DLPoD instances
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dlpod-alb-sg'

  # Allow AIG instances → DLPoD ALB on 443 (added after both SGs exist)
  AigToDlpodAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DlpodAlbSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref AigGatewaySecurityGroup
      Description: HTTPS from AIG gateway instances

  # DLPoD: appliance instances
  DlpodSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DLPoD instances - HTTPS from DLPoD ALB, all egress.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref DlpodAlbSecurityGroup
          Description: HTTPS from DLPoD ALB
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: All outbound
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-dlpod-sg'

  # ============================================================
  # Secrets Manager
  # ============================================================

  # AIG: Netskope credentials (tenant URL + API token)
  NetskopeSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-netskope-credentials'
      Description: Netskope tenant URL and RBAC v3 API token — read by the AIG activation Lambda.
      SecretString: !Sub '{"tenant_url": "${NetskopeTenantUrl}", "api_token": "${NetskopeApiToken}"}'

  # AIG: bootstrap secret — written per-instance by activation Lambda.
  # Includes enrollment token AND DLPoD cert + host so AIG configures DLP at boot.
  AigBootstrapSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-aig-bootstrap'
      Description: >
        Per-instance enrollment token and DLP configuration written by the activation Lambda.
        The AIG appliance reads this at boot via UserData and self-enrolls with DLP forwarding
        configured. Scale one AIG instance at a time — concurrent launches share this secret.
      SecretString: '{"bootstrap": true, "enrollment_token": ""}'

  # DLPoD: license key
  DlpodCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-dlpod-credentials'
      Description: DLPoD license key — read by DlpodBootstrapBuilderFunction to assemble bootstrap.json UserData.
      SecretString: !Sub '{"license_key": "${DlpodLicenseKey}"}'

  # DLPoD: CA + leaf cert and key pair — generated at stack create by CertGeneratorFunction.
  # Read by DlpodBootstrapBuilderFunction to assemble bootstrap.json UserData.
  DlpodCertKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub '${AWS::StackName}-dlpod-cert-key'
      Description: >
        DLPoD two-tier TLS: CA cert, leaf cert, and leaf private key (PKCS#8).
        Written by CertGeneratorFunction at stack create. Read by DlpodBootstrapBuilderFunction
        to build bootstrap.json UserData delivered to each DLPoD instance.
      SecretString: '{"ca_cert_pem":"pending","leaf_cert_pem":"pending","leaf_key_pem":"pending"}'

  # ============================================================
  # IAM — AIG gateway instance role
  # ============================================================

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-gateway-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy'
      Policies:
        - PolicyName: ReadBootstrapSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadBootstrapSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AigBootstrapSecret
  GatewayInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-gateway-profile'
      Roles: [!Ref GatewayRole]

  # ============================================================
  # IAM — AIG activation Lambda role
  # ============================================================

  AigActivationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-aig-activation-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AigActivationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt AigActivationLogGroup.Arn
              - Sid: GetNetskopeSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref NetskopeSecret
              - Sid: WriteBootstrapSecret
                Effect: Allow
                Action: secretsmanager:PutSecretValue
                Resource: !Ref AigBootstrapSecret
              - Sid: ReadDlpodCert
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/dlpod-cert'
              - Sid: ApplianceIdParam
                Effect: Allow
                Action: [ssm:PutParameter, ssm:GetParameter, ssm:DeleteParameter]
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/aig/${AWS::StackName}/*'
              - Sid: DescribeInstances
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              - Sid: CompleteLifecycle
                Effect: Allow
                Action: autoscaling:CompleteLifecycleAction
                Resource: !Sub 'arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-aig-asg'

  # ============================================================
  # IAM — AIG SNS lifecycle role
  # ============================================================

  AigLifecycleSnsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-aig-lifecycle-sns-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: autoscaling.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PublishToSns
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AigLifecycleSnsTopic

  # ============================================================
  # IAM — DLPoD instance role
  # ============================================================

  DlpodRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-dlpod-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy'
  DlpodInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-dlpod-profile'
      Roles: [!Ref DlpodRole]

  # ============================================================
  # DLPoD bootstrap builder — assembles bootstrap.json UserData
  # The base64-encoded UserData exceeds the 4,096-byte custom
  # resource response limit, so it is split across two invocations
  # and re-joined in the Launch Template with Fn::Join.
  # ============================================================

  DlpodBootstrapBuilderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-dlpod-bootstrap-builder'
      RetentionInDays: 30
  DlpodBootstrapBuilderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-dlpod-bootstrap-builder-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BootstrapBuilderPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DlpodBootstrapBuilderLogGroup.Arn
              - Sid: ReadCertKeySecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DlpodCertKeySecret
              - Sid: ReadCredentialsSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DlpodCredentialsSecret
  DlpodBootstrapBuilderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-dlpod-bootstrap-builder'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt DlpodBootstrapBuilderRole.Arn
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref DlpodBootstrapBuilderLogGroup
      Code:
        ZipFile: |
          import base64, json, logging, urllib.request, boto3
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          sm = boto3.client('secretsmanager')
          def send_cfn(event, context, status, data={}, pid=None):
              body = json.dumps({'Status': status, 'Reason': f'See {context.log_group_name}/{context.log_stream_name}', 'PhysicalResourceId': pid or event.get('PhysicalResourceId', 'bootstrap'), 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId'], 'Data': data}).encode()
              urllib.request.urlopen(urllib.request.Request(event['ResponseURL'], data=body, headers={'Content-Type': '', 'Content-Length': str(len(body))}, method='PUT'))
          def handler(event, context):
              props = event['ResourceProperties']
              try:
                  if event['RequestType'] in ('Create', 'Update'):
                      ck = json.loads(sm.get_secret_value(SecretId=props['CertKeySecretArn'])['SecretString'])
                      creds = json.loads(sm.get_secret_value(SecretId=props['CredentialsSecretArn'])['SecretString'])
                      bootstrap = {
                          'dlpaas': {
                              'server-cert': ck['leaf_cert_pem'],
                              'server-key': ck['leaf_key_pem'],
                              'server-intermediate-ca-chain': ck['ca_cert_pem'],
                          },
                          'dns': {'primary': props['DnsServer']},
                          'system': {'licensekey': creds['license_key']},
                          'persona': 'dlp-on-demand',
                      }
                      ud = base64.b64encode(json.dumps(bootstrap).encode()).decode()
                      mid = (len(ud) // 8) * 4
                      part = props.get('Part', '1')
                      chunk = ud[:mid] if part == '1' else ud[mid:]
                      logger.info('bootstrap.json %d bytes b64, part %s = %d bytes', len(ud), part, len(chunk))
                      send_cfn(event, context, 'SUCCESS', {'UserData': chunk}, f'part{part}')
                  else:
                      send_cfn(event, context, 'SUCCESS', {}, event.get('PhysicalResourceId', 'bootstrap'))
              except Exception:
                  logger.exception('DlpodBootstrapBuilderFunction failed')
                  send_cfn(event, context, 'FAILED', {}, 'FAILED')
  DlpodBootstrapPart1:
    Type: Custom::DlpodBootstrap
    DependsOn: DlpodAlbCertificate
    Properties:
      ServiceToken: !GetAtt DlpodBootstrapBuilderFunction.Arn
      Part: '1'
      CertKeySecretArn: !Ref DlpodCertKeySecret
      CredentialsSecretArn: !Ref DlpodCredentialsSecret
      DnsServer: '169.254.169.253'

  DlpodBootstrapPart2:
    Type: Custom::DlpodBootstrap
    DependsOn: DlpodAlbCertificate
    Properties:
      ServiceToken: !GetAtt DlpodBootstrapBuilderFunction.Arn
      Part: '2'
      CertKeySecretArn: !Ref DlpodCertKeySecret
      CredentialsSecretArn: !Ref DlpodCredentialsSecret
      DnsServer: '169.254.169.253'

  # ============================================================
  # DLPoD internal ALB + Route 53 private DNS
  # ============================================================

  DlpodPrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: aigw.internal
      VPCs:
        - VPCId: !Ref Vpc
          VPCRegion: !Ref 'AWS::Region'
      HostedZoneConfig:
        Comment: !Sub 'Private hosted zone for ${AWS::StackName} internal services (DLPoD, Guardrails)'

  DlpodAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-dlpod-alb'
      Type: application
      Scheme: internal
      SecurityGroups: [!Ref DlpodAlbSecurityGroup]
      Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
  DlpodTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-dlpod-tg'
      VpcId: !Ref Vpc
      Protocol: HTTPS
      Port: 443
      TargetType: instance
      HealthCheckProtocol: HTTPS
      HealthCheckPort: '443'
      HealthCheckPath: /
      Matcher:
        HttpCode: '200-499'
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
  DlpodListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref DlpodAlb
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !GetAtt DlpodAlbCertificate.CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DlpodTargetGroup

  DlpodDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref DlpodPrivateHostedZone
      Name: dlp.aigw.internal
      Type: A
      AliasTarget:
        DNSName: !GetAtt DlpodAlb.DNSName
        HostedZoneId: !GetAtt DlpodAlb.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  # ============================================================
  # DLPoD Launch Template + Auto Scaling Group
  # ============================================================

  DlpodLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-dlpod-lt'
      LaunchTemplateData:
        ImageId: !Ref DlpodAmiId
        InstanceType: !Ref DlpodInstanceType
        SecurityGroupIds: [!Ref DlpodSecurityGroup]
        IamInstanceProfile:
          Name: !Ref DlpodInstanceProfile
        UserData: !Join ['', [!GetAtt DlpodBootstrapPart1.UserData, !GetAtt DlpodBootstrapPart2.UserData]]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              Encrypted: true
              VolumeSize: 351
              VolumeType: gp3
              Iops: 9000
              DeleteOnTermination: true
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 1
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-dlpod'

  DlpodAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - DlpodBootstrapPart1
      - DlpodBootstrapPart2
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-dlpod-asg'
      LaunchTemplate:
        LaunchTemplateId: !Ref DlpodLaunchTemplate
        Version: !GetAtt DlpodLaunchTemplate.LatestVersionNumber
      MinSize: '1'
      MaxSize: '4'
      DesiredCapacity: !Ref DlpodDesiredCapacity
      VPCZoneIdentifier: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      TargetGroupARNs: [!Ref DlpodTargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 1800
  # ============================================================
  # DLPoD readiness gate — polls ALB target health before AIG launches
  #
  # AIG validates the DLPoD HTTPS endpoint during enrollment.
  # This custom resource waits until all DLPoD targets are healthy
  # in the ALB target group before GatewayAutoScalingGroup creates
  # AIG instances. Mirrors the Terraform null_resource.dlpod_ready gate.
  # ============================================================

  DlpodReadinessGateLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-dlpod-readiness'
      RetentionInDays: 7
  DlpodReadinessGateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-dlpod-readiness-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DlpodReadinessPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt DlpodReadinessGateLogGroup.Arn
              - Sid: DescribeTargetHealth
                Effect: Allow
                Action: elasticloadbalancing:DescribeTargetHealth
                Resource: '*'
  DlpodReadinessGateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-dlpod-readiness'
      Description: >
        Readiness gate — polls an ALB target group until all targets are healthy.
        Shared by the DLPoD and optional Guardrails gates that block AIG launch.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 900
      MemorySize: 128
      Role: !GetAtt DlpodReadinessGateRole.Arn
      LoggingConfig:
        LogFormat: Text
        LogGroup: !Ref DlpodReadinessGateLogGroup
      Code:
        ZipFile: |
          import json, logging, time, boto3
          from urllib.request import urlopen, Request
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          def cfn_send(event, status, reason=''):
              body = json.dumps({'Status': status, 'Reason': reason, 'PhysicalResourceId': event.get('PhysicalResourceId') or event['LogicalResourceId'], 'StackId': event['StackId'], 'RequestId': event['RequestId'], 'LogicalResourceId': event['LogicalResourceId']}).encode()
              req = Request(event['ResponseURL'], data=body, method='PUT')
              req.add_header('Content-Type', '')
              urlopen(req)
          def handler(event, context):
              try:
                  logger.info('RequestType: %s', event['RequestType'])
                  if event['RequestType'] != 'Create':
                      cfn_send(event, 'SUCCESS')
                      return
                  props = event['ResourceProperties']
                  tg_arn = props['TargetGroupArn']
                  timeout = int(props.get('TimeoutSeconds', '840'))
                  elb = boto3.client('elbv2')
                  deadline = time.time() + timeout
                  while time.time() < deadline:
                      targets = elb.describe_target_health(TargetGroupArn=tg_arn).get('TargetHealthDescriptions', [])
                      if targets and all(t['TargetHealth']['State'] == 'healthy' for t in targets):
                          logger.info('All %d target(s) healthy', len(targets))
                          cfn_send(event, 'SUCCESS')
                          return
                      healthy = sum(1 for t in targets if t['TargetHealth']['State'] == 'healthy')
                      logger.info('%d/%d target(s) healthy — waiting 30s...', healthy, len(targets))
                      time.sleep(30)
                  cfn_send(event, 'FAILED', f'Targets in {tg_arn.rsplit("/",2)[-2]} did not become healthy within {timeout}s')
              except Exception as e:
                  logger.exception('DlpodReadinessGate error')
                  cfn_send(event, 'FAILED', str(e))
  DlpodReadinessGate:
    Type: Custom::DlpodReadiness
    DependsOn: DlpodAutoScalingGroup
    Properties:
      ServiceToken: !GetAtt DlpodReadinessGateFunction.Arn
      TargetGroupArn: !Ref DlpodTargetGroup

  # ============================================================
  # AI Guardrails (optional — Condition: DeployGuardrails)
  #
  # GPU Auto Scaling Group running the Netskope aisecurityllm container,
  # fronted by an internal ALB at guardrails.aigw.internal. The AIG
  # bootstrap secret carries ai_guardrails.host so AIG forwards LLM
  # inspection requests here from first boot (mirrors the Terraform POV).
  #
  # Plain HTTP on the container port: the ai_guardrails bootstrap block has
  # no certificate field, traffic never leaves the private subnets, and the
  # ALB accepts connections only from AigGatewaySecurityGroup.
  #
  # No lifecycle hooks — the container self-starts from UserData. The AMI must
  # ship the NVIDIA driver, Docker and the NVIDIA Container Toolkit (AWS Deep
  # Learning Base GPU AMI) so no driver install or reboot happens at boot.
  # ============================================================

  GuardrailsRole:
    Condition: DeployGuardrails
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-guardrails-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy'
      Policies:
        - PolicyName: s3-image-download
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read-only access to the single image object (mirrors the Terraform POV policy).
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${GuardrailsImageS3Bucket}/${GuardrailsImageS3Key}'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${GuardrailsImageS3Bucket}'
                Condition:
                  StringLike:
                    s3:prefix: [!Ref GuardrailsImageS3Key]
  GuardrailsInstanceProfile:
    Condition: DeployGuardrails
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-guardrails-profile'
      Roles: [!Ref GuardrailsRole]

  GuardrailsAlbSecurityGroup:
    Condition: DeployGuardrails
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Guardrails ALB - HTTP from AIG instances, egress to Guardrails instances.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref GuardrailsContainerPort
          ToPort: !Ref GuardrailsContainerPort
          SourceSecurityGroupId: !Ref AigGatewaySecurityGroup
          Description: HTTP from AIG gateway instances
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref GuardrailsContainerPort
          ToPort: !Ref GuardrailsContainerPort
          CidrIp: !Ref VpcCidr
          Description: HTTP to Guardrails instances
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-guardrails-alb-sg'
  GuardrailsSecurityGroup:
    Condition: DeployGuardrails
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Guardrails instances - HTTP from Guardrails ALB, all egress (S3 via NAT).
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref GuardrailsContainerPort
          ToPort: !Ref GuardrailsContainerPort
          SourceSecurityGroupId: !Ref GuardrailsAlbSecurityGroup
          Description: HTTP from Guardrails ALB
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: All outbound
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-guardrails-sg'

  GuardrailsAlb:
    Condition: DeployGuardrails
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-guardrails-alb'
      Type: application
      Scheme: internal
      SecurityGroups: [!Ref GuardrailsAlbSecurityGroup]
      Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
  GuardrailsTargetGroup:
    Condition: DeployGuardrails
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-guardrails-tg'
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: !Ref GuardrailsContainerPort
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: !Ref GuardrailsHealthCheckPath
      Matcher:
        HttpCode: '200'
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
  GuardrailsListener:
    Condition: DeployGuardrails
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref GuardrailsAlb
      Protocol: HTTP
      Port: !Ref GuardrailsContainerPort
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GuardrailsTargetGroup

  GuardrailsDnsRecord:
    Condition: DeployGuardrails
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref DlpodPrivateHostedZone
      Name: guardrails.aigw.internal
      Type: A
      AliasTarget:
        DNSName: !GetAtt GuardrailsAlb.DNSName
        HostedZoneId: !GetAtt GuardrailsAlb.CanonicalHostedZoneID
        EvaluateTargetHealth: false

  GuardrailsLaunchTemplate:
    Condition: DeployGuardrails
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1030]   # GuardrailsAmiId is a String (see Parameters)
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-guardrails-lt'
      LaunchTemplateData:
        ImageId: !Ref GuardrailsAmiId
        InstanceType: !Ref GuardrailsInstanceType
        SecurityGroupIds: [!Ref GuardrailsSecurityGroup]
        IamInstanceProfile:
          Name: !Ref GuardrailsInstanceProfile
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              Encrypted: true
              VolumeSize: 100
              VolumeType: gp3
              DeleteOnTermination: true
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2   # 2 so the Docker container can reach IMDS if it needs to
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe
            exec > >(tee /var/log/user-data.log | logger -t user-data -s 2>/dev/console) 2>&1

            PORT='${GuardrailsContainerPort}'
            SIGNAL_URL='${GuardrailsWaitHandle}'

            signal_cfn() {
              curl -sf -X PUT -H 'Content-Type:' --data-binary \
                "{\"Status\":\"$1\",\"Reason\":\"$2\",\"UniqueId\":\"$(hostname)\",\"Data\":\"$1\"}" \
                "${!SIGNAL_URL}" || true
            }
            trap 'signal_cfn FAILURE "UserData script failed"' ERR

            # Fail fast if the AMI does not ship a working NVIDIA driver.
            nvidia-smi

            # Use the local NVMe SSD (g4dn/g5) for Docker storage and the image
            # tarball. The DLAMI auto-mounts it; fall back to formatting it ourselves.
            NVME=/opt/dlami/nvme
            if ! mountpoint -q "${!NVME}" 2>/dev/null; then
              NVME_DEV=$(lsblk -dpno NAME,MODEL | awk '/NVMe Instance Storage/{print $1; exit}')
              if [ -n "${!NVME_DEV}" ]; then
                mkfs.ext4 -q "${!NVME_DEV}"
                mkdir -p "${!NVME}"
                mount "${!NVME_DEV}" "${!NVME}"
              else
                NVME=/tmp
              fi
            fi
            TARBALL="${!NVME}/aisecurity-llm.tgz"

            # Install Docker CE if not present (Deep Learning Base AMIs omit it).
            if ! command -v docker &>/dev/null; then
              apt-get -o DPkg::Lock::Timeout=300 update -y
              apt-get -o DPkg::Lock::Timeout=300 install -y \
                apt-transport-https ca-certificates gnupg lsb-release curl
              mkdir -p /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
                https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
                > /etc/apt/sources.list.d/docker.list
              apt-get update -y
              apt-get install -y docker-ce docker-ce-cli containerd.io
            fi

            # Install NVIDIA Container Toolkit if not present.
            if ! dpkg -l nvidia-container-toolkit &>/dev/null; then
              curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
                | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] \
                https://nvidia.github.io/libnvidia-container/stable/deb/$(dpkg --print-architecture) /" \
                > /etc/apt/sources.list.d/nvidia-container-toolkit.list
              apt-get update -y
              apt-get install -y nvidia-container-toolkit
            fi

            # Configure NVIDIA runtime + Docker data-root on NVMe for fast I/O.
            nvidia-ctk runtime configure --runtime=docker
            mkdir -p "${!NVME}/docker"
            python3 -c "
            import json
            with open('/etc/docker/daemon.json') as f: d=json.load(f)
            d['data-root']='${!NVME}/docker'
            with open('/etc/docker/daemon.json','w') as f: json.dump(d,f)
            "
            systemctl enable docker
            systemctl restart docker

            # Download the Docker image tarball from S3, load it, then discover the tag.
            aws s3 cp 's3://${GuardrailsImageS3Bucket}/${GuardrailsImageS3Key}' "${!TARBALL}" \
              --region '${AWS::Region}' --no-progress
            docker load -i "${!TARBALL}"
            rm -f "${!TARBALL}"
            # Use the most-recently-loaded non-dangling image.
            IMAGE_URI=$(docker images --format '{{.Repository}}:{{.Tag}}' --filter 'dangling=false' | head -1)
            if [ -z "${!IMAGE_URI}" ] || [ "${!IMAGE_URI}" = "<none>:<none>" ]; then
              # Fallback: grab by image ID if no tag was assigned.
              IMAGE_URI=$(docker images --format '{{.ID}}' | head -1)
            fi
            echo "Using image: ${!IMAGE_URI}"
            if [ -z "${!IMAGE_URI}" ]; then
              echo "ERROR: no image found after docker load"; exit 1
            fi

            # Runtime flags match the validated Terraform POV.
            docker run -d --name guardrails \
              --gpus all --shm-size=1g \
              -e CUDA_VISIBLE_DEVICES=0 \
              -e TORCH_COMPILE_DISABLE=1 \
              -e PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128 \
              -e TOKENIZERS_PARALLELISM=false \
              --restart=unless-stopped \
              -p "${!PORT}:8080" \
              "${!IMAGE_URI}"

            # Poll until the container passes its health check, then signal CloudFormation.
            for i in $(seq 1 90); do
              if curl -sf "http://localhost:${!PORT}${GuardrailsHealthCheckPath}" >/dev/null; then
                echo "Guardrails container healthy on port ${!PORT}"
                signal_cfn SUCCESS "Container healthy"
                exit 0
              fi
              sleep 10
            done
            echo "ERROR: Guardrails not healthy after 15 minutes"
            signal_cfn FAILURE "Container not healthy after 15 min"
            exit 1
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-guardrails'

  GuardrailsAutoScalingGroup:
    Condition: DeployGuardrails
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-guardrails-asg'
      LaunchTemplate:
        LaunchTemplateId: !Ref GuardrailsLaunchTemplate
        Version: !GetAtt GuardrailsLaunchTemplate.LatestVersionNumber
      MinSize: '1'
      MaxSize: '4'
      DesiredCapacity: !Ref GuardrailsDesiredCapacity
      VPCZoneIdentifier: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      TargetGroupARNs: [!Ref GuardrailsTargetGroup]
      HealthCheckType: EC2

  # Blocks GatewayAutoScalingGroup until the first Guardrails instance signals
  # healthy via cfn-signal in UserData. AIG validates the guardrails host during
  # enrollment; an unreachable host leaves the appliance in an "unlinked" state.
  # WaitCondition supports up to 12 h — the Lambda readiness gate is capped at 900 s.
  GuardrailsWaitHandle:
    Condition: DeployGuardrails
    Type: AWS::CloudFormation::WaitConditionHandle

  GuardrailsReadinessGate:
    Condition: DeployGuardrails
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: GuardrailsAutoScalingGroup
    Properties:
      Handle: !Ref GuardrailsWaitHandle
      Timeout: '3600'
      Count: 1

  # ============================================================
  # AIG activation Lambda
  # Registers appliance with Netskope, reads the DLPoD CA cert from SSM
  # (written by CertGeneratorFunction at stack create), and writes the
  # AIG bootstrap secret including the dlp block so AIG configures DLP
  # forwarding at boot without any manual steps.
  #
  # GatewayAutoScalingGroup DependsOn DlpodReadinessGate ensures DLPoD
  # is serving HTTPS before any AIG instance launches.
  # ============================================================

  AigActivationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-aig-activation'
      RetentionInDays: 30
  AigActivationLambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: AigActivationLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-aig-activation'
      Description: >
        AIG lifecycle handler — registers appliance with Netskope, reads the DLPoD CA cert from
        SSM, writes AIG bootstrap secret with enrollment token and dlp block, completes lifecycle.
      Runtime: python3.12
      Handler: index.handler
      Timeout: 60
      MemorySize: 128
      Role: !GetAtt AigActivationLambdaRole.Arn
      Environment:
        Variables:
          STACK_NAME: !Ref 'AWS::StackName'
          SECRET_ARN: !Ref NetskopeSecret
          BOOTSTRAP_SECRET_ARN: !Ref AigBootstrapSecret
          DLPOD_CERT_PARAM: !Ref DlpodCertParameter
          DLP_HOST: 'https://dlp.aigw.internal'
          # Empty when the Guardrails tier is not deployed; the handler then omits ai_guardrails.
          GUARDRAILS_HOST: !If
            - DeployGuardrails
            - !Sub 'http://guardrails.aigw.internal:${GuardrailsContainerPort}/invocations'
            - ''
      Code:
        ZipFile: |
          import json, os, urllib.request, boto3, traceback

          sm  = boto3.client('secretsmanager')
          ssm = boto3.client('ssm')
          asg = boto3.client('autoscaling')
          ec2 = boto3.client('ec2')

          def api_call(url, path, token, method='GET', body=None):
              req = urllib.request.Request(
                  f"{url.rstrip('/')}{path}",
                  json.dumps(body).encode() if body else None,
                  method=method)
              req.add_header('Netskope-Api-Token', token)
              req.add_header('Content-Type', 'application/json')
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          def complete(msg, result):
              asg.complete_lifecycle_action(
                  LifecycleHookName=msg['LifecycleHookName'],
                  AutoScalingGroupName=msg['AutoScalingGroupName'],
                  LifecycleActionToken=msg['LifecycleActionToken'],
                  LifecycleActionResult=result)

          def handler(event, context):
              record = event.get('Records', [{}])[0]
              if record.get('EventSource') != 'aws:sns':
                  return
              msg = json.loads(record['Sns']['Message'])
              if msg.get('Event') == 'autoscaling:TEST_NOTIFICATION':
                  return

              instance_id = msg['EC2InstanceId']
              transition  = msg['LifecycleTransition']
              stack_name  = os.environ['STACK_NAME']

              try:
                  creds = json.loads(sm.get_secret_value(SecretId=os.environ['SECRET_ARN'])['SecretString'])
                  url, token = creds['tenant_url'], creds['api_token']

                  if transition == 'autoscaling:EC2_INSTANCE_LAUNCHING':
                      ip = ec2.describe_instances(InstanceIds=[instance_id])\
                             ['Reservations'][0]['Instances'][0].get('PrivateIpAddress', '0.0.0.0')
                      resp = api_call(url, '/api/v2/aig/appliances', token, 'POST', {
                          'name': f'{stack_name}-gw-{instance_id}',
                          'host': ip,
                          'ports': {'https': {'port': 443, 'enable': True},
                                    'http':  {'port': 80,  'enable': False}},
                      })
                      aid = str(resp['id'])
                      tok = resp.get('enrollment_token') or api_call(
                          url, f'/api/v2/aig/appliances/{aid}/enrollmenttokens',
                          token, 'POST').get('token', '')
                      ssm.put_parameter(Name=f'/aig/{stack_name}/{instance_id}',
                                        Value=aid, Type='String', Overwrite=True)

                      # Read DLPoD CA cert from SSM (written by CertGeneratorFunction at stack create)
                      dlp_cert = ssm.get_parameter(Name=os.environ['DLPOD_CERT_PARAM'])['Parameter']['Value']
                      dlp_host = os.environ['DLP_HOST']

                      payload = {
                          'bootstrap': True,
                          'enrollment_token': tok,
                          'dlp': {
                              'certificate': dlp_cert,
                              'host': dlp_host,
                          },
                      }
                      # Optional AI Guardrails host (plain HTTP, internal ALB) — same block the
                      # Terraform POV writes; AIG configures the guardrails service at enrollment.
                      guardrails_host = os.environ.get('GUARDRAILS_HOST', '')
                      if guardrails_host:
                          payload['ai_guardrails'] = {'host': guardrails_host}

                      sm.put_secret_value(
                          SecretId=os.environ['BOOTSTRAP_SECRET_ARN'],
                          SecretString=json.dumps(payload))
                      print(f'Registered appliance {aid} for {instance_id} '
                            f'(dlp=yes, guardrails={"yes" if guardrails_host else "no"}), completing CONTINUE')
                      complete(msg, 'CONTINUE')

                  elif transition == 'autoscaling:EC2_INSTANCE_TERMINATING':
                      try:
                          aid = ssm.get_parameter(Name=f'/aig/{stack_name}/{instance_id}')\
                                   ['Parameter']['Value']
                          api_call(url, f'/api/v2/aig/appliances/{aid}', token, 'DELETE')
                          ssm.delete_parameter(Name=f'/aig/{stack_name}/{instance_id}')
                          print(f'Deregistered appliance {aid} for {instance_id}')
                      except Exception:
                          print(traceback.format_exc())
                      complete(msg, 'CONTINUE')

              except Exception:
                  print(traceback.format_exc())
                  try:
                      complete(msg, 'ABANDON')
                  except Exception:
                      print(traceback.format_exc())

  # ============================================================
  # AIG SNS lifecycle chain
  # ============================================================

  AigLifecycleSnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-aig-lifecycle'
  AigLifecycleSnsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AigLifecycleSnsTopic
      Protocol: lambda
      Endpoint: !GetAtt AigActivationLambdaFunction.Arn

  AigLambdaLifecyclePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AigActivationLambdaFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AigLifecycleSnsTopic

  # ============================================================
  # AIG internet-facing ALB
  # ============================================================

  GatewayAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-aig-alb'
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref AigAlbSecurityGroup]
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
  GatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-aig-tg'
      VpcId: !Ref Vpc
      Protocol: HTTPS
      Port: 443
      TargetType: instance
      HealthCheckProtocol: HTTPS
      HealthCheckPort: '443'
      HealthCheckPath: /
      Matcher:
        HttpCode: '200-499'
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
  GatewayAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref GatewayAlb
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !If
            - UseAutoGeneratedAigCert
            - !GetAtt AigAlbCertificate.CertificateArn
            - !Ref AcmCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GatewayTargetGroup

  # ============================================================
  # AIG Launch Template + Auto Scaling Group
  #
  # DependsOn DlpodReadinessGate ensures all DLPoD instances are
  # healthy in the ALB target group before any AIG instance launches.
  # AIG validates the DLPoD HTTPS endpoint during enrollment, so
  # DLPoD must be serving before AIG instances boot.
  # ============================================================

  GatewayLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-aig-lt'
      LaunchTemplateData:
        ImageId: !Ref GatewayAmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds: [!Ref AigGatewaySecurityGroup]
        IamInstanceProfile:
          Name: !Ref GatewayInstanceProfile
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              Encrypted: true
              VolumeSize: 400
              VolumeType: gp3
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        UserData:
          Fn::Base64: !Sub '{"bootstrap_secret": "${AWS::StackName}-aig-bootstrap"}'
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${AWS::StackName}-aig-gateway'

  GatewayAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - AigLifecycleSnsSubscription
      - AigLambdaLifecyclePermission
      - DlpodReadinessGate
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-aig-asg'
      LaunchTemplate:
        LaunchTemplateId: !Ref GatewayLaunchTemplate
        Version: !GetAtt GatewayLaunchTemplate.LatestVersionNumber
      MinSize: '1'
      MaxSize: '4'
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      TargetGroupARNs: [!Ref GatewayTargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 600
      LifecycleHookSpecificationList:
        - LifecycleHookName: !Sub '${AWS::StackName}-aig-launch-hook'
          LifecycleTransition: autoscaling:EC2_INSTANCE_LAUNCHING
          HeartbeatTimeout: 120
          DefaultResult: ABANDON
          NotificationTargetARN: !Ref AigLifecycleSnsTopic
          RoleARN: !GetAtt AigLifecycleSnsRole.Arn
        - LifecycleHookName: !Sub '${AWS::StackName}-aig-terminate-hook'
          LifecycleTransition: autoscaling:EC2_INSTANCE_TERMINATING
          HeartbeatTimeout: 120
          DefaultResult: CONTINUE
          NotificationTargetARN: !Ref AigLifecycleSnsTopic
          RoleARN: !GetAtt AigLifecycleSnsRole.Arn
      Tags:
        # Ordering only: DependsOn cannot target a conditional resource, so the !Ref here
        # makes this ASG wait for GuardrailsReadinessGate when Guardrails is deployed.
        - Key: GuardrailsGate
          Value: !If [DeployGuardrails, !Ref GuardrailsReadinessGate, disabled]
          PropagateAtLaunch: false
  # ============================================================
  # AIG Step Scaling
  # ============================================================

  GatewayScaleOutPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref GatewayAutoScalingGroup
      PolicyType: StepScaling
      AdjustmentType: ChangeInCapacity
      MetricAggregationType: Average
      EstimatedInstanceWarmup: 600
      StepAdjustments:
        - MetricIntervalLowerBound: 0
          ScalingAdjustment: 1

  GatewayHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-aig-high-cpu'
      AlarmDescription: Scale out AIG ASG when average CPU exceeds threshold for two consecutive 5-minute periods.
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref GatewayAutoScalingGroup
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref ScaleOutCpuThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref GatewayScaleOutPolicy
Outputs:

  # ── AIG ──

  AigAlbDnsName:
    Description: AIG internet-facing ALB DNS name — configure a CNAME to this value
    Value: !GetAtt GatewayAlb.DNSName

  AigAutoScalingGroupName:
    Description: AIG ASG name
    Value: !Ref GatewayAutoScalingGroup

  AigBootstrapSecretName:
    Description: AIG bootstrap secret name — contains enrollment token and DLP config per instance
    Value: !Sub '${AWS::StackName}-aig-bootstrap'

  AigActivationLogGroup:
    Description: AIG activation Lambda log group
    Value: !Sub '/aws/lambda/${AWS::StackName}-aig-activation'

  AigAlbCertParameterName:
    Condition: UseAutoGeneratedAigCert
    Description: >
      SSM parameter containing the auto-generated AIG ALB self-signed cert PEM.
      Retrieve with: aws ssm get-parameter --name <value> --query Parameter.Value --output text
    Value: !Sub '/${AWS::StackName}/aig-cert'

  AigScaleOutAlarmName:
    Description: CloudWatch alarm that triggers AIG scale-out
    Value: !Ref GatewayHighCpuAlarm

  # ── DLPoD ──

  DlpodServiceUrl:
    Description: DLPoD HTTPS service URL (private DNS) — written into AIG bootstrap secret as dlp.host
    Value: 'https://dlp.aigw.internal'

  DlpodCertParameterName:
    Description: SSM parameter containing the DLPoD CA certificate PEM — written into AIG bootstrap secret as dlp.certificate
    Value: !Sub '/${AWS::StackName}/dlpod-cert'

  DlpodBootstrapLogGroup:
    Description: DLPoD bootstrap builder Lambda log group
    Value: !Sub '/aws/lambda/${AWS::StackName}-dlpod-bootstrap-builder'

  # ── AI Guardrails (only when deployed) ──

  GuardrailsServiceUrl:
    Condition: DeployGuardrails
    Description: Guardrails inference URL (private DNS, HTTP) — written into AIG bootstrap secret as ai_guardrails.host
    Value: !Sub 'http://guardrails.aigw.internal:${GuardrailsContainerPort}/invocations'

  GuardrailsAlbDnsName:
    Condition: DeployGuardrails
    Description: Guardrails internal ALB DNS name
    Value: !GetAtt GuardrailsAlb.DNSName

  GuardrailsAutoScalingGroupName:
    Condition: DeployGuardrails
    Description: Guardrails Auto Scaling Group name
    Value: !Ref GuardrailsAutoScalingGroup

  # ── VPC ──

  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
